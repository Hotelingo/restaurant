name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - claude/funny-allen-rasy71

permissions:
  contents: read

jobs:
  architecture-boundaries:
    name: Architecture boundaries and production guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce package boundaries
        run: python3 scripts/check_boundaries.py
      - name: Test production database guard
        run: python3 tests/architecture/test_guard_db_target.py
      - name: Guard against unescaped % in psycopg SQL
        run: python3 tests/architecture/test_sql_percent_escaping.py

  web-foundation:
    name: Next.js typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_AUTH_BASE_URL: https://example.neonauth.us-east-2.aws.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-cookie-secret-at-least-thirty-two-characters
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Run axe component accessibility gate
        working-directory: apps/web
        run: npm run a11y:test

      - name: Run password policy tests
        working-directory: apps/web
        run: npm run policy:test
      - name: Build
        working-directory: apps/web
        run: npm run build

  container-images:
    name: API and worker container images
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile -t restaurant-api:ci .

      - name: Build worker image
        run: docker build -f workers/Dockerfile -t restaurant-worker:ci .

      - name: API container starts, reports health honestly and runs as non-root
        run: |
          docker run -d --name db --network host -e POSTGRES_PASSWORD=smoke postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          # The API fails fast at startup on a bad DATABASE_URL, so it gets a real database here.
          docker run -d --name api --network host \
            -e APP_ENV=ci -e PORT=8000 \
            -e DATABASE_URL=postgresql://postgres:smoke@127.0.0.1:5432/postgres \
            -e NEON_AUTH_BASE_URL=https://example.neon.tech/neondb/auth \
            -e NEON_AUTH_JWKS_URL=https://example.neon.tech/neondb/auth/.well-known/jwks.json \
            restaurant-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"ok"'
          curl -fsS http://127.0.0.1:8000/health/ready | grep -q '"database":"ok"'
          test "$(docker exec api id -u)" != "0"
          docker exec api python scripts/migrate.py --help > /dev/null
          docker exec api sh -c 'test ! -e /app/.env && test ! -e /app/apps && test ! -e /app/.git'
          # With the database gone, liveness stays up and readiness says so.
          docker stop db
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:8000/health/ready)" = "503"

      - name: Worker image imports and runs as non-root
        run: |
          docker run --rm restaurant-worker:ci python -c "import workers.pl_worker, packages.calc_engine"
          test "$(docker run --rm restaurant-worker:ci id -u)" != "0"

      - name: API container logs on failure
        if: failure()
        run: docker logs api || true

  browser-journey:
    name: Browser journey (sign-up to signed Owner Pack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpr_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rpr_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rpr_dev
      LOGS: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            dev/local-stack/auth-standin/package-lock.json

      - name: Install API, worker, S3 stand-in and Playwright
        run: python -m pip install -e "api" -r workers/requirements.txt "moto[server]>=5" "playwright>=1.47"

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Install web app and auth stand-in
        run: |
          npm ci --no-audit --no-fund --prefix apps/web
          npm ci --no-audit --no-fund --prefix dev/local-stack/auth-standin

      - name: Database — auth stand-in schema, ledger migrations, worker login
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rpr_dev
        run: |
          psql -v ON_ERROR_STOP=1 -f dev/local-stack/neon_auth_standin.sql
          python scripts/migrate.py --target local up
          psql -v ON_ERROR_STOP=1 -c "alter role restaurant_worker login password 'ci-only-worker-password'"

      - name: Start auth stand-in, S3 stand-in, API and worker
        run: |
          mkdir -p "$LOGS"
          (cd dev/local-stack/auth-standin && \
            AUTH_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rpr_dev \
            nohup node server.mjs > "$LOGS/auth.log" 2>&1 &)
          nohup moto_server -H 127.0.0.1 -p 9000 > "$LOGS/moto.log" 2>&1 &
          APP_ENV=ci \
          DATABASE_URL=postgresql://restaurant_app:local-dev-only@localhost:5432/rpr_dev \
          NEON_AUTH_BASE_URL=http://localhost:4000/neondb/auth \
          NEON_AUTH_JWKS_URL=http://localhost:4000/neondb/auth/.well-known/jwks.json \
          CORS_ORIGINS=http://localhost:3000 \
          STORAGE_BUCKET=uploads AWS_REGION=us-east-1 AWS_ENDPOINT_URL_S3=http://127.0.0.1:9000 \
          AWS_ACCESS_KEY_ID=local AWS_SECRET_ACCESS_KEY=local \
          PYTHONPATH=.:api nohup uvicorn app.main:app --app-dir api --host 127.0.0.1 --port 8000 > "$LOGS/api.log" 2>&1 &
          DATABASE_URL=postgresql://restaurant_worker:ci-only-worker-password@localhost:5432/rpr_dev \
          PYTHONPATH=. CALC_WORKER_ID=ci-browser nohup python -m workers.pl_worker --poll-seconds 1 > "$LOGS/worker.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:4000/neondb/auth/ok > /dev/null 2>&1 && break; sleep 1; done
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/ > /dev/null 2>&1 && break; sleep 1; done
          python -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', region_name='us-east-1', aws_access_key_id='local', aws_secret_access_key='local').create_bucket(Bucket='uploads')"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health/ready > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health/ready

      - name: Build and start the web app
        env:
          NEON_AUTH_BASE_URL: http://localhost:4000/neondb/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-not-for-any-real-environment
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build --prefix apps/web
          (cd apps/web && nohup npm start -- -p 3000 > "$LOGS/web.log" 2>&1 &)
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/auth/sign-in && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:3000/auth/sign-in

      - name: Owner journey — sign-up, data in, review, independent sign-off
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: python tests/e2e/owner_journey.py

      - name: Keep screenshots and service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey
          path: |
            e2e-artifacts
            e2e-logs
          retention-days: 7

  api-unit:
    name: FastAPI unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        run: python -m pip install -e "api[dev]"
      - name: Run API tests
        run: pytest api/tests

  neon-foundation-db:
    name: Neon-native foundation schema and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neon_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5433
      PGDATABASE: neon_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Create Neon Auth stub and application role
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema neon_auth;
          create table neon_auth."user" (
            id uuid primary key,
            name text not null default '',
            email text not null default '',
            "emailVerified" boolean not null default false
          );
          create role restaurant_app login password 'ci-only-password';
          SQL

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration runner dependencies
        run: python -m pip install "psycopg[binary]>=3.2"

      - name: Test the migration ledger runner
        run: python tests/migrations/test_migration_runner.py

      - name: Apply Neon-native migrations through the ledger
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/neon_test
        run: python scripts/migrate.py --target local up

      - name: Give the least-privilege worker role a CI-only login
        run: psql -v ON_ERROR_STOP=1 -c "alter role restaurant_worker login password 'ci-only-worker-password'"

      - name: Re-running migrations is a no-op
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/neon_test
        run: |
          python scripts/migrate.py --target local up | tee /tmp/second-run.txt
          grep -q "up to date" /tmp/second-run.txt

      - name: Run Neon-native foundation tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_neon_foundation.sql

      - name: Run setup context and period tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_setup_detail.sql

      - name: Run operating-control tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_operating_controls.sql

      - name: Run membership and invitation tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_members_invitations.sql

      - name: Run audited staff-read gate tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_staff_read_gate.sql

      - name: Run import mapping persistence tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_import_mapping.sql

      - name: Run ingestion persistence tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_ingestion_persistence.sql

      - name: Run source-file safety metadata tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_source_file_safety.sql

      - name: Run canonical financial fact tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_financial_facts.sql

      - name: Run atomic financial commit tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_atomic_financial_commit.sql

      - name: Run import orchestration metadata tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_import_orchestration_metadata.sql

      - name: Run mapping confirmation tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_mapping_confirmation.sql

      - name: Run calculation run persistence tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_calc_run_persistence.sql

      - name: Run review and FRAME tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_review_frame.sql

      - name: Run review shortlist tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_review_shortlist.sql

      - name: Run diagnosis and evidence tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_diagnosis_evidence.sql

      - name: Run decision discipline tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_decisions.sql

      - name: Run action register tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_action_register.sql

      - name: Run prior-action verification tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_prior_action_check.sql

      - name: Run Owner Pack claim tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_owner_pack_claims.sql

      - name: Run reviewer sign-off and history tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_reviewer_signoff.sql

      - name: Run Food Cost canonical fact tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_food_cost_facts.sql

      - name: Run Revenue canonical fact tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_revenue_facts.sql

      - name: Run Labour canonical fact tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_labour_facts.sql

      - name: Run C02 evidence contract tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_c02_evidence.sql

      - name: Run import audit writer tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_import_audit_writer.sql

      - name: Run period calculation request tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_period_calculation_requests.sql

      - name: Run Owner Pack server role tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_pack_server_role.sql

      - name: Run calculation worker role tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_worker_role.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calculation worker dependencies
        run: python -m pip install -r workers/requirements.txt

      - name: Seed PL worker integration fixture
        run: psql -v ON_ERROR_STOP=1 -f db/tests/seed_pl_worker.sql

      - name: Run PL worker end-to-end
        env:
          DATABASE_URL: postgresql://restaurant_worker:ci-only-worker-password@localhost:5433/neon_test
          PYTHONPATH: .
          CALC_WORKER_ID: github-ci-worker
        run: |
          python -m workers.pl_worker --once
          python -m workers.pl_worker --once

      - name: Verify PL worker persisted snapshot
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_pl_worker_results.sql

      - name: Seed Food Cost worker integration fixture
        run: psql -v ON_ERROR_STOP=1 -f db/tests/seed_fc_worker.sql

      - name: Run Food Cost worker end-to-end
        env:
          DATABASE_URL: postgresql://restaurant_worker:ci-only-worker-password@localhost:5433/neon_test
          PYTHONPATH: .
          CALC_WORKER_ID: github-fc-worker
        run: |
          python -m workers.pl_worker --once
          python -m workers.pl_worker --once

      - name: Verify Food Cost worker persisted snapshot
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_fc_worker_results.sql

      - name: Seed Revenue worker integration fixture
        run: psql -v ON_ERROR_STOP=1 -f db/tests/seed_revenue_worker.sql

      - name: Run Revenue worker end-to-end
        env:
          DATABASE_URL: postgresql://restaurant_worker:ci-only-worker-password@localhost:5433/neon_test
          PYTHONPATH: .
          CALC_WORKER_ID: github-revenue-worker
        run: |
          python -m workers.pl_worker --once
          python -m workers.pl_worker --once

      - name: Verify Revenue worker persisted snapshot
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_revenue_worker_results.sql

      - name: Seed Labour/Other worker integration fixture
        run: psql -v ON_ERROR_STOP=1 -f db/tests/seed_labour_other_worker.sql

      - name: Run Labour/Other worker end-to-end
        env:
          DATABASE_URL: postgresql://restaurant_worker:ci-only-worker-password@localhost:5433/neon_test
          PYTHONPATH: .
          CALC_WORKER_ID: github-labour-worker
        run: |
          python -m workers.pl_worker --once
          python -m workers.pl_worker --once

      - name: Verify Labour/Other worker persisted snapshot
        run: psql -v ON_ERROR_STOP=1 -f db/tests/test_labour_other_worker_results.sql

      - name: Seed R1 twelve-step acceptance organisation
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/seed_r1_acceptance.sql

      - name: Run R1 acceptance calculation worker
        env:
          DATABASE_URL: postgresql://restaurant_worker:ci-only-worker-password@localhost:5433/neon_test
          PYTHONPATH: .
          CALC_WORKER_ID: github-r1-acceptance
        run: python -m workers.pl_worker --once

      - name: Advance R1 acceptance through Owner Pack review
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/advance_r1_acceptance.sql

      - name: Install reviewer API for R1 gate integration
        run: python -m pip install -e "api"

      - name: Run R1 review gate and sign-off
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/neon_test
          PYTHONPATH: .:api
          NEON_AUTH_BASE_URL: https://example.neon.tech/neondb/auth
          NEON_AUTH_JWKS_URL: https://example.neon.tech/neondb/auth/.well-known/jwks.json
        run: python tests/integration/run_r1_review_gate_signoff.py

      - name: Verify R1 acceptance lineage and immutability
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/verify_r1_acceptance.sql

      - name: Verify Slice 5 Food Cost acceptance and review-spine guard
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/verify_slice5_acceptance.sql

      - name: Verify Slice 6 Revenue acceptance and review-spine guard
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/verify_slice6_acceptance.sql

      - name: Verify Slice 7 Labour/Other acceptance and review-spine guard
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/verify_slice7_acceptance.sql


  calc-worker:
    name: Calculation worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: python -m pip install -r workers/requirements.txt
      - name: Run calculation worker unit tests
        run: python -m unittest discover -s workers/tests -v

  calc-engine:
    name: Calculation engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run calculation engine tests
        run: python -m unittest discover -s packages/calc_engine/tests -v

  review-gate:
    name: Review gate engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run review gate engine tests
        run: python -m unittest discover -s packages/review_gate/tests -v

  import-engine:
    name: Import engine parser and fingerprint tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run import engine tests
        run: python -m unittest discover -s packages/import_engine/tests -v

  golden-parity:
    name: Golden parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Amberside golden parity
        run: python3 tests/golden/test_amberside_parity.py

  slice1-database:
    name: Slice 1 database integrity and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rpr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: rpr_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Create Supabase auth/role stubs
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create extension if not exists pgcrypto;
          create table auth.users (
            id uuid primary key default gen_random_uuid(),
            email text
          );
          create or replace function auth.uid() returns uuid
          language sql stable
          as $$
            select coalesce(
              nullif(current_setting('request.jwt.claim.sub', true), ''),
              (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')
            )::uuid
          $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'authenticated')
              then create role authenticated; end if;
            if not exists (select 1 from pg_roles where rolname = 'anon')
              then create role anon; end if;
          end $$;
          SQL

      - name: Apply accepted Slice 1 migrations
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/migrations/0*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run constraint tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/test_slice1_constraints.sql

      - name: Run RLS tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/test_slice1_rls.sql
